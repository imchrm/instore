[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stories-backend"
version = "0.1.0"
description = "Приватный бэкенд для нарезки видео с YouTube/Instagram под Telegram Stories"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "imchrm", email = "im.chrm@gmail.com" }]
keywords = ["telegram", "stories", "video", "ffmpeg", "yt-dlp", "fastapi"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "yt-dlp>=2024.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/imchrm/instore"

# --- Сборка (src-layout) ---------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/stories_backend"]

# --- ruff: линтер и форматтер ----------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ - проектная документация (проза с иллюстративными фрагментами кода),
# не исходники; ruff её не проверяет и не форматирует.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations (полные аннотации типов)
    "RUF", # ruff-specific
    "PL",  # pylint
]
ignore = [
    "PLR0913", # too-many-arguments: порты domain намеренно имеют много kwargs
    # Рабочий язык документации и комментариев - русский (см. docs/CONTEXT.md);
    # правила о "неоднозначных" Unicode-символах дают ложные срабатывания.
    "RUF001", # ambiguous character in identifier
    "RUF002", # ambiguous character in docstring
    "RUF003", # ambiguous character in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004", # magic-value-comparison: допустимо в assert-ах тестов
]

[tool.ruff.lint.isort]
known-first-party = ["stories_backend"]

# --- mypy: строгая проверка типов ------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
mypy_path = "src:tests"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

# --- pytest ----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
